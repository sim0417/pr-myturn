<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B6CFF"/>
      <stop offset="1" stop-color="#7A3FF2"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="dot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD25A"/>
      <stop offset="1" stop-color="#FF9F1C"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1b1446" flood-opacity=".35"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#2a1a6e" flood-opacity=".35"/>
    </filter>
  </defs>

  <!-- macOS 아이콘 격자: 824 사각형, 바깥 여백 100 -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#gloss)"/>

  <!-- 풀 리퀘스트 기호 -->
  <g filter="url(#soft)" fill="none" stroke="#fff" stroke-width="46" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="372" cy="352" r="62"/>
    <line x1="372" y1="414" x2="372" y2="610"/>
    <circle cx="372" cy="672" r="62"/>
    <circle cx="652" cy="672" r="62"/>
    <path d="M652 610 V460 Q652 352 544 352 H492"/>
    <path d="M552 292 L492 352 L552 412"/>
  </g>

  <!-- 내 차례 표시 -->
  <g filter="url(#soft)">
    <circle cx="742" cy="282" r="78" fill="url(#dot)" stroke="#fff" stroke-width="18"/>
  </g>
</svg>
